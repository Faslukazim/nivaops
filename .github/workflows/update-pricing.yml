name: One-time pricing update
on:
  push:
    branches: [main]
    paths: [.github/workflows/update-pricing.yml]
permissions:
  contents: write
jobs:
  update-pricing:
    if: github.event.head_commit.message != 'Update NivaOps pricing limits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update pricing limits
        run: python -c 'from pathlib import Path; p=Path("src/LandingPage.jsx"); s=p.read_text(); s=s.replace("Up to 25 beds · 1 property","Up to 50 beds · 1 property",1).replace("Up to 100 beds</strong> · Multiple properties","Up to 150 beds</strong> · Multiple properties",1); p.write_text(s)'
      - name: Commit and remove workflow
        run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add src/LandingPage.jsx && git rm .github/workflows/update-pricing.yml && git commit -m 'Update NivaOps pricing limits' && git push
