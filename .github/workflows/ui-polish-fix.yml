name: Fix tenant form UI

on:
  push:
    paths:
      - 'src/.ui-polish-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tenant form UI
        shell: python
        run: |
          from pathlib import Path
          app = Path('src/App.jsx')
          text = app.read_text()
          replacements = [
              ('body:has(form input[placeholder="Full name"])', 'body:has(form input[type="tel"])'),
              ('div:has(> form input[placeholder="Full name"])', 'div:has(> form input[type="tel"])'),
              ('placeholder="9876543210"', 'placeholder="10-digit mobile number"'),
              ("setPhoneError('Enter a valid 10-digit Indian mobile number (e.g. 9876543210)');", "setPhoneError('Enter a valid 10-digit mobile number');"),
              ("setPhoneError('Enter a valid 10-digit Indian mobile number')", "setPhoneError('Enter a valid 10-digit mobile number')"),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          old = '''            <input\n              required\n              value={form.phone}'''
          new = '''            <input\n              required\n              type="tel"\n              value={form.phone}'''
          if old not in text: raise SystemExit('Monthly tenant phone input block not found')
          text = text.replace(old, new, 1)
          old = '''          {initialTenant && <IconBtn variant="ghost" onClick={onCancel}><X className="h-4 w-4" /></IconBtn>}'''
          new = '''          <IconBtn variant="ghost" onClick={onCancel} title="Close"><X className="h-4 w-4" /></IconBtn>'''
          if old not in text: raise SystemExit('Tenant form close button block not found')
          text = text.replace(old, new, 1)
          old = '''            onSubmit={editingTenant ? onUpdateTenant : (data) => { onAddTenant(data); setShowForm(false); }}'''
          new = '''            onSubmit={editingTenant\n              ? async (data) => { await onUpdateTenant(data); setShowForm(false); }\n              : async (data) => { await onAddTenant(data); setShowForm(false); }}'''
          if old not in text: raise SystemExit('Tenant form submit lifecycle block not found')
          text = text.replace(old, new, 1)
          old = '''                  onAddTenant={t => { handleAdd(t); setRoomPrefill(null); }}'''
          new = '''                  onAddTenant={async t => { await handleAdd(t); setRoomPrefill(null); }}'''
          if old not in text: raise SystemExit('Parent tenant add callback not found')
          text = text.replace(old, new, 1)
          app.write_text(text)
          css = Path('src/polish.css')
          text = css.read_text()
          text = text.replace('content: "10-digit mobile number";', 'content: "10-digit number";')
          text = text.replace('left: 58px;\n  bottom: 11px;\n  pointer-events: none;\n  color: #728198;', 'left: 58px;\n  bottom: 11px;\n  white-space: nowrap;\n  pointer-events: none;\n  color: #728198;')
          css.write_text(text)
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/polish.css
          git commit -m "Fix tenant form drawer and phone fields" || exit 0
          git push
