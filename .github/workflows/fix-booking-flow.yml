name: Repair booking flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'repair: apply booking flow')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply booking flow fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          text = app.read_text()

          old = """  async function handleConvertBooking(booking) {
              // Verify bed is still available before converting
              try {
                const rooms = await fetchRoomsWithBeds(selectedPropertyId);
                const room = rooms.find(r => r.id === booking.room_id);
                const bed = room?.beds?.find(b => b.id === booking.bed_id);
                if (!bed) { toast.error('This bed no longer exists.'); return; }
              } catch { /* non-critical — proceed */ }
              try { await convertBooking(booking.id, booking.bed_id); } catch (e) { toast.error(e.message); return; }
              // Pre-fill the add-tenant form. Use roomPrefill (no initialTenant) so
              // TenantForm enters \"new tenant\" mode with name/phone as separate state.
              setRoomPrefill({
                propertyId: selectedPropertyId,
                roomId: booking.room_id,
                bedId: booking.bed_id,
                prefillName: booking.name,
                prefillPhone: booking.phone,
                advanceAmount: Number(booking.advance_amount || 0),
              });
              setEditingTenant(null);
              fetchBookings(selectedPropertyId).then(setPendingBookings).catch(() => {});
              setRoomsVersion(v => v + 1);
              navigateTo('tenants');
            }
          """
          new = """  async function handleConvertBooking(booking) {
              // A booking stays pending while the operator completes the tenant form.
              // Conversion is finalized only after createTenant succeeds.
              try {
                const rooms = await fetchRoomsWithBeds(selectedPropertyId);
                const room = rooms.find(r => r.id === booking.room_id);
                const bed = room?.beds?.find(b => b.id === booking.bed_id);
                if (!bed) { toast.error('This bed no longer exists.'); return; }
              } catch { /* non-critical — proceed */ }

              setRoomPrefill({
                propertyId: selectedPropertyId,
                roomId: booking.room_id,
                bedId: booking.bed_id,
                prefillName: booking.name,
                prefillPhone: booking.phone,
                advanceAmount: Number(booking.advance_amount || 0),
                bookingId: booking.id,
              });
              setEditingTenant(null);
              navigateTo('tenants');
            }
          """
          if old not in text:
              raise SystemExit('handleConvertBooking block not found')
          text = text.replace(old, new, 1)

          old = """      const c = await createTenant({ ...rest, paymentStatus: 'Unpaid', paymentDate: '' });
              if (_photoFile && c.id) {
          """
          new = """      const c = await createTenant({ ...rest, paymentStatus: 'Unpaid', paymentDate: '' });
              if (roomPrefill?.bookingId) {
                await convertBooking(roomPrefill.bookingId);
              }
              if (_photoFile && c.id) {
          """
          if old not in text:
              raise SystemExit('createTenant insertion point not found')
          text = text.replace(old, new, 1)

          old = """    } catch (e) { toast.error(e.message); }
              finally { setSaving(false); }
            }
          """
          new = """    } catch (e) { toast.error(e.message); throw e; }
              finally { setSaving(false); }
            }
          """
          if old not in text:
              raise SystemExit('handleAdd catch block not found')
          text = text.replace(old, new, 1)

          old = """                  onAddTenant={t => { handleAdd(t); setRoomPrefill(null); }}
          """
          new = """                  onAddTenant={async t => { await handleAdd(t); setRoomPrefill(null); }}
          """
          if old not in text:
              raise SystemExit('onAddTenant prop not found')
          text = text.replace(old, new, 1)

          old = """  useEffect(() => {
              if (editingTenant) setShowForm(true);
            }, [editingTenant]);
          """
          new = """  useEffect(() => {
              if (editingTenant || roomPrefill) setShowForm(true);
            }, [editingTenant, roomPrefill]);
          """
          if old not in text:
              raise SystemExit('TenantsPage form effect not found')
          text = text.replace(old, new, 1)

          old = """            onSubmit={editingTenant ? onUpdateTenant : (data) => { onAddTenant(data); setShowForm(false); }}
          """
          new = """            onSubmit={editingTenant ? onUpdateTenant : async (data) => { await onAddTenant(data); setShowForm(false); }}
          """
          if old not in text:
              raise SystemExit('TenantForm submit handler not found')
          text = text.replace(old, new, 1)

          app.write_text(text)

          prop = Path('src/services/propertyService.js')
          text = prop.read_text()
          old = """  const { data: bookings } = await supabase
    .from('bookings')
    .select('*')
    .eq('property_id', propertyId)
    .eq('status', 'pending');
"""
          new = """  const { data: bookings, error: bookingsError } = await supabase
    .from('bookings')
    .select('*')
    .eq('property_id', propertyId)
    .eq('status', 'pending');
  if (bookingsError) throw bookingsError;
"""
          if old in text:
              text = text.replace(old, new, 1)
          prop.write_text(text)
          PY

      - name: Verify changes
        run: |
          grep -q "bookingId: booking.id" src/App.jsx
          grep -q "if (editingTenant || roomPrefill) setShowForm(true)" src/App.jsx
          grep -q "await convertBooking(roomPrefill.bookingId)" src/App.jsx
          grep -q "bookingsError" src/services/propertyService.js

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/services/propertyService.js .github/workflows/fix-booking-flow.yml
          git diff --cached --quiet && exit 0
          git commit -m "repair: apply booking flow fixes"
          git push
